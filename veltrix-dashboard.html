<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0a0e17;
    --bg2: #111725;
    --card: #161d2e;
    --border: #232b3d;
    --text: #e5ecf5;
    --text2: #8892a6;
    --accent: #00dce1;
    --accent2: #ff00ea;
    --success: #28c76f;
    --danger: #ea5455;
    --warning: #ff9f43;
  }
  [data-theme="light"] {
    --bg: #f4f6fa;
    --bg2: #ffffff;
    --card: #ffffff;
    --border: #e1e6ef;
    --text: #1a2233;
    --text2: #6a7488;
    --accent: #0084d1;
    --accent2: #a4007d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* ═════ LOGIN ═════ */
  #login {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg);
    z-index: 1000;
  }
  #login.hidden { display: none; }
  .login-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px;
    width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .login-box h1 {
    font-size: 24px; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .login-box p { color: var(--text2); font-size: 13px; margin-bottom: 28px; }
  .login-box label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--text2); margin-bottom: 6px; margin-top: 16px; }
  .login-box input {
    width: 100%; padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border 0.2s;
  }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button {
    width: 100%; margin-top: 24px; padding: 13px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px;
    color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; letter-spacing: 1px;
    transition: transform 0.15s;
  }
  .login-box button:hover { transform: translateY(-2px); }
  .login-error { color: var(--danger); font-size: 12px; margin-top: 14px; text-align: center; min-height: 16px; }

  /* ═════ HEADER ═════ */
  #app { display: none; }
  #app.visible { display: block; }
  header {
    position: sticky; top: 0;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex; align-items: center; justify-content: space-between;
    z-index: 100;
  }
  header h1 {
    font-size: 18px; letter-spacing: 2px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  .btn {
    padding: 8px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--border); transform: translateY(-1px); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #fff; font-weight: 600;
  }

  /* ═════ MAIN ═════ */
  main { padding: 32px; max-width: 1600px; margin: 0 auto; }

  .projects-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }

  .project-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .project-card:hover {
    transform: translateY(-4px);
    border-color: var(--accent);
    box-shadow: 0 10px 30px rgba(0,220,225,0.15);
  }
  .project-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--proj-color, var(--accent));
  }
  .project-card .name {
    font-size: 16px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .project-card .stats-row {
    display: flex; justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .project-card .stats-row:last-child { border: none; }
  .project-card .stats-row span:first-child { color: var(--text2); }
  .project-card .stats-row span:last-child { font-weight: 700; color: var(--text); }
  .project-card .delete-btn {
    position: absolute; top: 14px; right: 14px;
    width: 26px; height: 26px;
    background: rgba(234, 84, 85, 0.15);
    border: none; border-radius: 6px;
    color: var(--danger);
    cursor: pointer; font-size: 14px;
    opacity: 0; transition: opacity 0.2s;
  }
  .project-card:hover .delete-btn { opacity: 1; }
  .project-card .delete-btn:hover { background: var(--danger); color: #fff; }

  .add-card {
    background: transparent;
    border: 2px dashed var(--border);
    border-radius: 16px;
    min-height: 180px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text2);
    font-size: 40px;
    font-weight: 300;
  }
  .add-card:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,220,225,0.05);
  }

  /* ═════ MODAL ═════ */
  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center;
    z-index: 500; padding: 20px;
  }
  .modal.visible { display: flex; }
  .modal-content {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    width: 100%; max-width: 480px;
    max-height: 90vh; overflow-y: auto;
  }
  .modal-content h2 { font-size: 20px; margin-bottom: 6px; }
  .modal-content p { color: var(--text2); font-size: 13px; margin-bottom: 22px; }
  .modal-content label {
    display: block; font-size: 11px;
    text-transform: uppercase; letter-spacing: 1px;
    color: var(--text2); margin-bottom: 6px; margin-top: 16px;
  }
  .modal-content input {
    width: 100%; padding: 12px 14px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font-size: 13px; outline: none;
  }
  .modal-content input:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; margin-top: 24px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-size: 13px; cursor: pointer; border: none; font-weight: 600; }
  .modal-actions .cancel { background: var(--border); color: var(--text); }
  .modal-actions .confirm { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }

  /* ═════ DETAIL VIEW ═════ */
  #detail {
    position: fixed; inset: 0;
    background: var(--bg);
    z-index: 200;
    display: none;
    overflow-y: auto;
  }
  #detail.visible { display: block; }

  .detail-header {
    padding: 20px 32px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
    background: var(--bg2);
    position: sticky; top: 0; z-index: 10;
  }
  .detail-header h2 { font-size: 20px; flex: 1; }

  .detail-content { padding: 32px; max-width: 1600px; margin: 0 auto; }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
  }
  .kpi .label { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text2); margin-bottom: 8px; }
  .kpi .value { font-size: 28px; font-weight: 800; color: var(--accent); }

  .section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 22px;
    margin-bottom: 22px;
  }
  .section h3 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--text2); margin-bottom: 16px;
  }

  #map { height: 480px; border-radius: 10px; overflow: hidden; z-index: 1; }
  .leaflet-container { background: var(--bg2); }

  .top-list { display: flex; flex-direction: column; gap: 8px; }
  .top-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    background: var(--bg);
    border-radius: 8px;
    font-size: 13px;
  }
  .top-item .rank { color: var(--text2); width: 20px; font-weight: 700; }
  .top-item .name { flex: 1; }
  .top-item .count { font-weight: 700; color: var(--accent); }

  .recent-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .recent-table th {
    text-align: left; padding: 10px 12px;
    color: var(--text2); font-weight: 600;
    text-transform: uppercase; letter-spacing: 1px; font-size: 10px;
    border-bottom: 1px solid var(--border);
  }
  .recent-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }
  .recent-table tr:hover td { background: var(--bg); }

  .loading {
    text-align: center; padding: 60px 20px;
    color: var(--text2); font-size: 14px;
  }
  .loading::after {
    content: '...'; animation: dots 1.5s infinite;
  }
  @keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
  }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    padding: 14px 20px;
    font-size: 13px;
    z-index: 9999;
    opacity: 0; transform: translateX(30px);
    transition: all 0.3s;
    max-width: 340px;
  }
  .toast.visible { opacity: 1; transform: translateX(0); }
  .toast.error { border-left-color: var(--danger); }

  @media (max-width: 600px) {
    header { padding: 12px 16px; }
    main { padding: 16px; }
    .detail-header { padding: 14px 16px; }
    .detail-content { padding: 16px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h1>Dashboard</h1>
    <p>Accès restreint</p>
    <label>Identifiant</label>
    <input type="text" id="login-user" autocomplete="username" />
    <label>Mot de passe</label>
    <input type="password" id="login-pass" autocomplete="current-password" />
    <button id="login-btn">Se connecter</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header>
    <h1>📊 DASHBOARD</h1>
    <div class="header-actions">
      <button class="btn" id="theme-btn">🌙 Thème</button>
      <button class="btn" id="logout-btn">Déconnexion</button>
    </div>
  </header>
  <main>
    <div class="projects-grid" id="projects-grid"></div>
  </main>
</div>

<!-- MODAL AJOUT PROJET -->
<div class="modal" id="add-modal">
  <div class="modal-content">
    <h2>Nouveau projet</h2>
    <p>Colle l'URL de ton Apps Script (elle finit par <code>/exec</code>) et ta clé secrète.</p>
    <label>Nom du projet</label>
    <input type="text" id="proj-name" placeholder="VELTRIXJS" />
    <label>URL Apps Script</label>
    <input type="text" id="proj-url" placeholder="https://script.google.com/macros/s/.../exec" />
    <label>Clé secrète</label>
    <input type="password" id="proj-key" placeholder="Mot de passe secret" />
    <div class="modal-actions">
      <button class="cancel" id="add-cancel">Annuler</button>
      <button class="confirm" id="add-confirm">Ajouter</button>
    </div>
  </div>
</div>

<!-- DETAIL VIEW -->
<div id="detail">
  <div class="detail-header">
    <button class="btn" id="detail-back">← Retour</button>
    <h2 id="detail-title">Projet</h2>
    <button class="btn" id="detail-refresh">🔄 Rafraîchir</button>
  </div>
  <div class="detail-content">
    <div id="detail-body">
      <div class="loading">Chargement</div>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════
const AUTH_USER = 'admin';
const AUTH_PASS = 'MpE$MhPoaJmy@Jb8';
const LS_PROJECTS = 'vx_dashboard_projects';
const LS_THEME = 'vx_dashboard_theme';
const SS_AUTH = 'vx_dashboard_auth';

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function $(sel) { return document.querySelector(sel); }
function $$(sel) { return document.querySelectorAll(sel); }

function toast(msg, isError = false) {
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('visible'));
  setTimeout(() => {
    el.classList.remove('visible');
    setTimeout(() => el.remove(), 400);
  }, 3000);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function hashSimple(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) {
    h = ((h << 5) - h) + str.charCodeAt(i);
    h = h & h;
  }
  return Math.abs(h).toString(36);
}

// ═══════════════════════════════════════════════════════
//  STORAGE
// ═══════════════════════════════════════════════════════
function getProjects() {
  try { return JSON.parse(localStorage.getItem(LS_PROJECTS)) || []; }
  catch(e) { return []; }
}
function saveProjects(list) {
  localStorage.setItem(LS_PROJECTS, JSON.stringify(list));
}

// ═══════════════════════════════════════════════════════
//  LOGIN
// ═══════════════════════════════════════════════════════
function tryLogin() {
  const u = $('#login-user').value.trim();
  const p = $('#login-pass').value;
  if (u === AUTH_USER && p === AUTH_PASS) {
    sessionStorage.setItem(SS_AUTH, '1');
    showApp();
  } else {
    $('#login-error').textContent = 'Identifiant ou mot de passe incorrect';
  }
}

function showApp() {
  $('#login').classList.add('hidden');
  $('#app').classList.add('visible');
  renderProjects();
}

function logout() {
  sessionStorage.removeItem(SS_AUTH);
  location.reload();
}

// ═══════════════════════════════════════════════════════
//  THEME
// ═══════════════════════════════════════════════════════
function applyTheme() {
  const theme = localStorage.getItem(LS_THEME) || 'dark';
  document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : '');
  $('#theme-btn').textContent = theme === 'light' ? '☀️ Thème' : '🌙 Thème';
}
function toggleTheme() {
  const current = localStorage.getItem(LS_THEME) || 'dark';
  localStorage.setItem(LS_THEME, current === 'dark' ? 'light' : 'dark');
  applyTheme();
}

// ═══════════════════════════════════════════════════════
//  PROJECT GRID
// ═══════════════════════════════════════════════════════
function renderProjects() {
  const grid = $('#projects-grid');
  const projects = getProjects();
  grid.innerHTML = '';

  projects.forEach((p, idx) => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.style.setProperty('--proj-color', p.color || '#00dce1');
    card.dataset.id = p.id;
    card.innerHTML = `
      <button class="delete-btn" data-del="${idx}">✕</button>
      <div class="name">📁 ${escapeHtml(p.name)}</div>
      <div class="stats-row"><span>Utilisateurs</span><span data-stat="users">—</span></div>
      <div class="stats-row"><span>IPs uniques</span><span data-stat="ips">—</span></div>
      <div class="stats-row"><span>Chargements</span><span data-stat="loads">—</span></div>
      <div class="stats-row"><span>Ajouté</span><span>${new Date(p.createdAt).toLocaleDateString('fr-FR')}</span></div>
    `;
    card.addEventListener('click', e => {
      if (e.target.closest('.delete-btn')) return;
      openDetail(p);
    });
    grid.appendChild(card);

    // Charger les stats du projet
    fetchProjectStats(p).then(stats => {
      if (!stats) return;
      const el = card.querySelector('[data-stat="users"]');
      if (el) el.textContent = stats.uniqueUsers ?? '?';
      const el2 = card.querySelector('[data-stat="ips"]');
      if (el2) el2.textContent = stats.uniqueIPs ?? '?';
      const el3 = card.querySelector('[data-stat="loads"]');
      if (el3) el3.textContent = stats.totalLoads ?? '?';
    });
  });

  // Bouton +
  const add = document.createElement('div');
  add.className = 'add-card';
  add.textContent = '+';
  add.addEventListener('click', () => $('#add-modal').classList.add('visible'));
  grid.appendChild(add);

  // Suppression
  $$('.delete-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.del);
      if (!confirm('Supprimer ce projet ?')) return;
      const list = getProjects();
      list.splice(idx, 1);
      saveProjects(list);
      renderProjects();
      toast('Projet supprimé');
    });
  });
}

// ═══════════════════════════════════════════════════════
//  API FETCH
// ═══════════════════════════════════════════════════════
async function fetchProjectStats(p) {
  try {
    const url = p.url + '?key=' + encodeURIComponent(p.key) + '&action=stats';
    const res = await fetch(url);
    const txt = await res.text();
    if (txt === 'Page not found') return null;
    return JSON.parse(txt);
  } catch(e) { return null; }
}

async function fetchProjectData(p) {
  try {
    const url = p.url + '?key=' + encodeURIComponent(p.key) + '&action=data';
    const res = await fetch(url);
    const txt = await res.text();
    return JSON.parse(txt);
  } catch(e) { return null; }
}

// ═══════════════════════════════════════════════════════
//  ADD PROJECT
// ═══════════════════════════════════════════════════════
function addProject() {
  const name = $('#proj-name').value.trim();
  const url = $('#proj-url').value.trim();
  const key = $('#proj-key').value;

  if (!name || !url || !key) { toast('Remplis tous les champs', true); return; }
  if (!url.startsWith('https://script.google.com/')) { toast('URL invalide', true); return; }

  const projects = getProjects();
  projects.push({
    id: 'p_' + Date.now(),
    name,
    url,
    key,
    color: '#' + Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0'),
    createdAt: Date.now()
  });
  saveProjects(projects);
  $('#add-modal').classList.remove('visible');
  $('#proj-name').value = '';
  $('#proj-url').value = '';
  $('#proj-key').value = '';
  renderProjects();
  toast('Projet ajouté !');
}

// ═══════════════════════════════════════════════════════
//  DETAIL VIEW
// ═══════════════════════════════════════════════════════
let currentProject = null;
let currentMap = null;

async function openDetail(p) {
  currentProject = p;
  $('#detail').classList.add('visible');
  $('#detail-title').textContent = p.name;
  $('#detail-body').innerHTML = '<div class="loading">Chargement des données</div>';
  await refreshDetail();
}

async function refreshDetail() {
  if (!currentProject) return;
  $('#detail-body').innerHTML = '<div class="loading">Chargement des données</div>';

  const data = await fetchProjectData(currentProject);
  if (!data || !data.rows) {
    $('#detail-body').innerHTML = '<div class="loading" style="color:var(--danger)">Erreur de chargement. Vérifie l\'URL et la clé.</div>';
    return;
  }

  const rows = data.rows;

  // Calculs
  const uniqueFp = new Set();
  const uniqueIp = new Set();
  const byCountry = {};
  const byVersion = {};
  const byDay = {};

  rows.forEach(r => {
    if (r.fingerprint) uniqueFp.add(r.fingerprint);
    if (r.ip && r.ip !== 'unknown') uniqueIp.add(r.ip);
    if (r.country) byCountry[r.country] = (byCountry[r.country] || 0) + 1;
    if (r.version) byVersion[r.version] = (byVersion[r.version] || 0) + 1;
    const d = (r.date || '').slice(0, 10);
    if (d) byDay[d] = (byDay[d] || 0) + 1;
  });

  // Points sur la carte (dédupliqués par coordonnées, taille = nombre de connexions)
  const mapPoints = {};
  rows.forEach(r => {
    if (r.lat && r.lon) {
      const k = r.lat.toFixed(2) + ',' + r.lon.toFixed(2);
      if (!mapPoints[k]) mapPoints[k] = { lat: r.lat, lon: r.lon, count: 0, city: r.city, country: r.country };
      mapPoints[k].count++;
    }
  });

  // Tri top pays / versions
  const topCountries = Object.entries(byCountry).sort((a,b) => b[1]-a[1]).slice(0, 8);
  const topVersions = Object.entries(byVersion).sort((a,b) => b[1]-a[1]).slice(0, 5);

  // Rendu
  $('#detail-body').innerHTML = `
    <div class="kpis">
      <div class="kpi"><div class="label">👥 Utilisateurs uniques</div><div class="value">${uniqueFp.size}</div></div>
      <div class="kpi"><div class="label">🌐 IPs uniques</div><div class="value">${uniqueIp.size}</div></div>
      <div class="kpi"><div class="label">📥 Chargements totaux</div><div class="value">${rows.length}</div></div>
      <div class="kpi"><div class="label">🌍 Pays différents</div><div class="value">${Object.keys(byCountry).length}</div></div>
    </div>

    <div class="section">
      <h3>🌍 Carte des connexions</h3>
      <div id="map"></div>
    </div>

    <div class="section">
      <h3>🏆 Top pays</h3>
      <div class="top-list">
        ${topCountries.length ? topCountries.map((c, i) => `
          <div class="top-item">
            <span class="rank">#${i+1}</span>
            <span class="name">${escapeHtml(c[0])}</span>
            <span class="count">${c[1]}</span>
          </div>
        `).join('') : '<div style="color:var(--text2)">Aucune donnée</div>'}
      </div>
    </div>

    <div class="section">
      <h3>📦 Versions utilisées</h3>
      <div class="top-list">
        ${topVersions.length ? topVersions.map((v, i) => `
          <div class="top-item">
            <span class="rank">#${i+1}</span>
            <span class="name">v${escapeHtml(v[0])}</span>
            <span class="count">${v[1]}</span>
          </div>
        `).join('') : '<div style="color:var(--text2)">Aucune donnée</div>'}
      </div>
    </div>

    <div class="section">
      <h3>🕐 Dernières connexions</h3>
      <div style="overflow-x:auto">
        <table class="recent-table">
          <thead>
            <tr><th>Date</th><th>Pays</th><th>Ville</th><th>Version</th><th>Écran</th><th>Langue</th></tr>
          </thead>
          <tbody>
            ${rows.slice(-20).reverse().map(r => `
              <tr>
                <td>${new Date(r.date).toLocaleString('fr-FR')}</td>
                <td>${escapeHtml(r.country) || '—'}</td>
                <td>${escapeHtml(r.city) || '—'}</td>
                <td>v${escapeHtml(r.version)}</td>
                <td>${escapeHtml(r.screen)}</td>
                <td>${escapeHtml(r.lang)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  // Initialiser la carte
  setTimeout(() => initMap(mapPoints), 50);
}

function initMap(points) {
  if (currentMap) { currentMap.remove(); currentMap = null; }
  const container = document.getElementById('map');
  if (!container) return;

  currentMap = L.map('map', {
    worldCopyJump: true,
    zoomControl: true
  }).setView([20, 0], 2);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CartoDB',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(currentMap);

  const pts = Object.values(points);
  if (pts.length === 0) return;

  // Heatmap simple : cercle dont le rayon dépend du nombre de connexions
  const maxCount = Math.max(...pts.map(p => p.count));
  pts.forEach(p => {
    const r = 4 + (p.count / maxCount) * 16;
    L.circleMarker([p.lat, p.lon], {
      radius: r,
      color: '#00dce1',
      fillColor: '#00dce1',
      fillOpacity: 0.4,
      weight: 2
    }).addTo(currentMap).bindPopup(
      `<b>${escapeHtml(p.city || 'Inconnu')}</b><br>${escapeHtml(p.country || '')}<br>${p.count} connexion${p.count > 1 ? 's' : ''}`
    );
  });

  // Ajuster la vue
  const bounds = L.latLngBounds(pts.map(p => [p.lat, p.lon]));
  currentMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 5 });
}
